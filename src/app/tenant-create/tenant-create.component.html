<div style="max-width: 600px; margin: 0 auto;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h2 style="color: var(--text-main); font-size: 20px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px;">
        <i class="pi pi-building" style="color: var(--primary-blue);"></i> Create New Tenant
      </h2>
      <p style="color: var(--text-muted); font-size: 13px; margin: 4px 0 0 0;">
        Establish an isolated tenant partition for users and workflows
      </p>
    </div>
    <a routerLink="/admin/tenants" class="btn btn-secondary btn-sm">
      <i class="pi pi-arrow-left"></i> Back to Tenants
    </a>
  </div>

  <div class="table-card" style="padding: 24px;">
    
    <div *ngIf="errorMessage" style="color: var(--danger-color); background: var(--danger-light); border: 1px solid #FECACA; padding: 12px 16px; margin-bottom: 20px; border-radius: var(--radius-sm); font-size: 13px; display: flex; align-items: center; gap: 8px;">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      
      <div>
        <label style="font-weight: 600; display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-main);">
          Tenant ID * <span style="font-weight: 400; color: var(--text-muted); font-size: 12px;">(Unique slug, e.g., 'company-a', 'north-region')</span>
        </label>
        <input type="text" [(ngModel)]="tenantData.id" placeholder="e.g. division_north" style="width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 13px; box-sizing: border-box;" />
      </div>

      <div>
        <label style="font-weight: 600; display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-main);">
          Tenant Name * <span style="font-weight: 400; color: var(--text-muted); font-size: 12px;">(e.g., 'Division North Operations')</span>
        </label>
        <input type="text" [(ngModel)]="tenantData.name" placeholder="e.g. Division North Operations" style="width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; box-sizing: border-box;" />
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; padding-top: 18px; border-top: 1px solid var(--border-color);">
        <a routerLink="/admin/tenants" class="btn btn-secondary">
          Cancel
        </a>
        <button (click)="onCreateTenant()" class="btn btn-primary">
          <i class="pi pi-check"></i> Save Tenant
        </button>
      </div>

    </div>

  </div>

</div>
