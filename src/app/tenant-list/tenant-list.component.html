<div style="display: flex; justify-content: space-between; align-items: center;">
  <h2>Tenant Management</h2>
  <a routerLink="/admin/tenants/create" style="padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">+ Create New Tenant</a>
</div>

<table border="1" cellpadding="10" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
  <tr style="background-color: #f8f9fa;">
    <th>Tenant ID</th>
    <th>Tenant Name</th>
    <th>Action</th>
  </tr>
  <tr *ngFor="let tenant of tenants">
    <td style="font-weight: bold;">{{ tenant.id }}</td>
    <td>{{ tenant.name }}</td>
    <td>
      <a [routerLink]="['/admin/tenants/edit', tenant.id]" style="padding: 5px 10px; background-color: #ffc107; color: black; text-decoration: none; border-radius: 4px;">Edit</a>
    </td>
  </tr>
</table>
