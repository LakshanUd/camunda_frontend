<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
  <div>
    <h2 style="color: var(--text-main); font-size: 20px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px;">
      <i class="pi pi-building" style="color: var(--primary-blue);"></i> Tenant Management
    </h2>
    <p style="color: var(--text-muted); font-size: 13px; margin: 4px 0 0 0;">
      Multi-tenancy isolation and organizational units
    </p>
  </div>
  <a routerLink="/admin/tenants/create" class="btn btn-primary btn-sm">
    <i class="pi pi-plus"></i> Create New Tenant
  </a>
</div>

<div class="table-card">
  <div class="table-scroll-container">
    <table class="enterprise-table">
      <thead>
        <tr>
          <th class="pinned-left" style="width: 240px;">Tenant ID</th>
          <th>Tenant Name</th>
          <th class="pinned-right" style="text-align: right; width: 120px;">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tenant of tenants">
          <td class="pinned-left">
            <span class="id-badge" style="font-weight: 600; color: var(--primary-blue);">{{ tenant.id }}</span>
          </td>
          <td>
            <div style="font-weight: 600; color: var(--text-main);">{{ tenant.name }}</div>
          </td>
          <td class="pinned-right" style="text-align: right;">
            <a [routerLink]="['/admin/tenants/edit', tenant.id]" class="btn btn-secondary btn-sm">
              <i class="pi pi-pencil"></i> Edit
            </a>
          </td>
        </tr>
        <tr *ngIf="tenants.length === 0">
          <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 40px 16px;">
            <i class="pi pi-building" style="font-size: 2rem; color: var(--text-light); margin-bottom: 8px; display: block;"></i>
            <div>No tenants found. Click "+ Create New Tenant" to add one.</div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
