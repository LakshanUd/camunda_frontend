<div style="display: flex; justify-content: center; align-items: center; height: 80vh;">
  <div style="border: 1px solid #ccc; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px;">
    <h2 style="text-align: center; margin-top: 0;">Camunda Login</h2>
    
    <div *ngIf="errorMessage" style="color: red; background: #ffe6e6; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;">
      {{ errorMessage }}
    </div>

    <div style="margin-bottom: 15px;">
      <label style="font-weight: bold; display: block; margin-bottom: 5px;">User ID</label>
      <input type="text" [(ngModel)]="credentials.username" style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <div style="margin-bottom: 20px;">
      <label style="font-weight: bold; display: block; margin-bottom: 5px;">Password</label>
      <input type="password" [(ngModel)]="credentials.password" style="width: 100%; padding: 8px; box-sizing: border-box;" />
    </div>

    <button (click)="onLogin()" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Login</button>
  </div>
</div>
