<div style="width: 100%; text-align: left;">
  
  <div *ngIf="errorMessage" style="color: var(--danger-color); background: var(--danger-light); border: 1px solid #FECACA; padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px; display: flex; align-items: center; gap: 8px;">
    <i class="pi pi-exclamation-circle"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <div style="margin-bottom: 16px;">
    <label style="font-weight: 600; font-size: 13px; color: var(--text-main); display: block; margin-bottom: 6px;">Username</label>
    <div style="position: relative;">
      <i class="pi pi-user" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 13px;"></i>
      <input type="text" [(ngModel)]="credentials.username" (keyup.enter)="onLogin()" placeholder="Enter your username"
        style="width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-main); background: #FFFFFF; outline: none; transition: border-color 0.1s ease;"
        onfocus="this.style.borderColor='var(--primary-blue)'; this.style.boxShadow='0 0 0 3px var(--primary-focus-ring)';"
        onblur="this.style.borderColor='var(--border-color)'; this.style.boxShadow='none';" />
    </div>
  </div>

  <div style="margin-bottom: 22px;">
    <label style="font-weight: 600; font-size: 13px; color: var(--text-main); display: block; margin-bottom: 6px;">Password</label>
    <div style="position: relative;">
      <i class="pi pi-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 13px;"></i>
      <input type="password" [(ngModel)]="credentials.password" (keyup.enter)="onLogin()" placeholder="••••••••"
        style="width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-main); background: #FFFFFF; outline: none; transition: border-color 0.1s ease;"
        onfocus="this.style.borderColor='var(--primary-blue)'; this.style.boxShadow='0 0 0 3px var(--primary-focus-ring)';"
        onblur="this.style.borderColor='var(--border-color)'; this.style.boxShadow='none';" />
    </div>
  </div>

  <button (click)="onLogin()" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 14px;">
    <i class="pi pi-sign-in"></i> Sign In to Workflow System
  </button>

</div>
