<div style="display: flex; justify-content: space-between; align-items: center;">
  <h2>User Management</h2>
  <a routerLink="/admin/users/create" style="padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">+ Create New User</a>
</div>

<table border="1" cellpadding="10" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
  <tr style="background-color: #f8f9fa;">
    <th>ID</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Email</th>
    <th>Action</th>
  </tr>
  <tr *ngFor="let user of users">
    <td>{{ user.id }}</td>
    <td>{{ user.firstName }}</td>
    <td>{{ user.lastName }}</td>
    <td>{{ user.email }}</td>
    <td>
      <a [routerLink]="['/admin/users/edit', user.id]" style="padding: 5px 10px; background-color: #ffc107; color: black; text-decoration: none; border-radius: 4px;">Edit Profile</a>
    </td>
  </tr>
</table>
