<div style="max-width: 600px; margin: 0 auto;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div>
      <h2 style="color: var(--text-main); font-size: 20px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px;">
        <i class="pi pi-user-plus" style="color: var(--primary-blue);"></i> Create New Group
      </h2>
      <p style="color: var(--text-muted); font-size: 13px; margin: 4px 0 0 0;">
        Add a new group for workflow task candidate assignment
      </p>
    </div>
    <a routerLink="/admin/groups" class="btn btn-secondary btn-sm">
      <i class="pi pi-arrow-left"></i> Back to Groups
    </a>
  </div>

  <div class="table-card" style="padding: 24px;">
    
    <div *ngIf="errorMessage" style="color: var(--danger-color); background: var(--danger-light); border: 1px solid #FECACA; padding: 12px 16px; margin-bottom: 20px; border-radius: var(--radius-sm); font-size: 13px; display: flex; align-items: center; gap: 8px;">
      <i class="pi pi-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 18px;">
      
      <div>
        <label style="font-weight: 600; display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-main);">
          Group ID * <span style="font-weight: 400; color: var(--text-muted); font-size: 12px;">(Unique slug, e.g., 'sales', 'management')</span>
        </label>
        <input type="text" [(ngModel)]="groupData.id" placeholder="e.g. finance_reviewers" style="width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 13px; box-sizing: border-box;" />
      </div>

      <div>
        <label style="font-weight: 600; display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-main);">
          Group Name * <span style="font-weight: 400; color: var(--text-muted); font-size: 12px;">(e.g., 'Finance Reviewers')</span>
        </label>
        <input type="text" [(ngModel)]="groupData.name" placeholder="e.g. Finance & Accounting Team" style="width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; box-sizing: border-box;" />
      </div>

      <div>
        <label style="font-weight: 600; display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-main);">
          Group Type *
        </label>
        <select [(ngModel)]="groupData.type" style="width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); font-size: 13px; box-sizing: border-box; background: white;">
          <option value="WORKFLOW">WORKFLOW (Process Task Routing)</option>
          <option value="SYSTEM">SYSTEM (Platform Role)</option>
          <option value="EXTERNAL">EXTERNAL (Directory Sync)</option>
        </select>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; padding-top: 18px; border-top: 1px solid var(--border-color);">
        <a routerLink="/admin/groups" class="btn btn-secondary">
          Cancel
        </a>
        <button (click)="onCreateGroup()" class="btn btn-primary">
          <i class="pi pi-check"></i> Save Group
        </button>
      </div>

    </div>

  </div>

</div>
