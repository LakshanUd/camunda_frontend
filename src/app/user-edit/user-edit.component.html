<div style="display: flex; justify-content: space-between; align-items: center;">
  <h2>Manage User: <span style="color: #007bff;">{{ userId }}</span></h2>
  <a routerLink="/admin/users" style="padding: 8px 15px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px;">&larr; Back to List</a>
</div>

<div style="display: flex; border-bottom: 2px solid #ccc; margin-bottom: 20px;">
  <button (click)="activeTab = 'Profile'" [style.borderBottom]="activeTab === 'Profile' ? '3px solid #007bff' : 'none'" style="padding: 10px 20px; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 16px;">Profile</button>
  <button (click)="activeTab = 'Account'" [style.borderBottom]="activeTab === 'Account' ? '3px solid #007bff' : 'none'" style="padding: 10px 20px; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 16px;">Account</button>
  <button (click)="activeTab = 'Groups'" [style.borderBottom]="activeTab === 'Groups' ? '3px solid #007bff' : 'none'" style="padding: 10px 20px; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 16px;">Groups</button>
  <button (click)="activeTab = 'Tenants'" [style.borderBottom]="activeTab === 'Tenants' ? '3px solid #007bff' : 'none'" style="padding: 10px 20px; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 16px;">Tenants</button>
</div>

<div *ngIf="activeTab === 'Profile'" style="max-width: 500px;">
  <h3>Update Profile details</h3>
  <div *ngIf="profileMsg" style="color: white; background: #28a745; padding: 10px; border-radius: 4px; margin-bottom: 15px;">{{ profileMsg }}</div>
  
  <div style="margin-bottom: 15px;"><label style="font-weight: bold; display: block;">First Name *</label>
    <input type="text" [(ngModel)]="profile.firstName" style="width: 100%; padding: 8px; box-sizing: border-box;" /></div>
  <div style="margin-bottom: 15px;"><label style="font-weight: bold; display: block;">Last Name *</label>
    <input type="text" [(ngModel)]="profile.lastName" style="width: 100%; padding: 8px; box-sizing: border-box;" /></div>
  <div style="margin-bottom: 15px;"><label style="font-weight: bold; display: block;">Email</label>
    <input type="email" [(ngModel)]="profile.email" style="width: 100%; padding: 8px; box-sizing: border-box;" /></div>
  
  <button (click)="updateProfile()" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Save Profile</button>
</div>

<div *ngIf="activeTab === 'Account'" style="max-width: 500px;">
  <h3>Change Password</h3>
  <div *ngIf="accountMsg" style="color: black; background: #ffc107; padding: 10px; border-radius: 4px; margin-bottom: 15px;">{{ accountMsg }}</div>

  <div style="margin-bottom: 15px;"><label style="font-weight: bold; display: block;">Current Password *</label>
    <input type="password" [(ngModel)]="passwords.current" style="width: 100%; padding: 8px; box-sizing: border-box;" /></div>
  <div style="margin-bottom: 15px;"><label style="font-weight: bold; display: block;">New Password *</label>
    <input type="password" [(ngModel)]="passwords.new" style="width: 100%; padding: 8px; box-sizing: border-box;" /></div>
  <div style="margin-bottom: 20px;"><label style="font-weight: bold; display: block;">Repeat New Password *</label>
    <input type="password" [(ngModel)]="passwords.repeat" style="width: 100%; padding: 8px; box-sizing: border-box;" /></div>
  
  <button (click)="updatePassword()" style="padding: 10px 20px; background-color: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 40px;">Update Password</button>

  <hr style="border: 1px solid #eee; margin-bottom: 20px;" />

  <h3 style="color: #dc3545;">Danger Zone</h3>
  <p style="color: gray;">Once you delete a user, there is no going back. Please be certain.</p>
  <button (click)="deleteAccount()" style="padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete Account</button>
</div>

<div *ngIf="activeTab === 'Groups' || activeTab === 'Tenants'">
  <div style="padding: 40px; text-align: center; background: #f8f9fa; border: 1px dashed #ccc; border-radius: 8px;">
    <h3 style="color: gray;">Future Development</h3>
    <p>The {{ activeTab }} module will be implemented in a future update.</p>
  </div>
</div>
